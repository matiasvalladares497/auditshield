services:
  # 1. Backend Web Service (FastAPI) - Plan Gratis
  - type: web
    name: auditshield-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditshield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 2. Frontend Web Service (Next.js) - Plan Gratis
  - type: web
    name: auditshield-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: auditshield-backend
          property: host

databases:
  # PostgreSQL Administrada - Plan Gratis
  - name: auditshield-db
    databaseName: auditshield
    user: auditshield
    plan: free
