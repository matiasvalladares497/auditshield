services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: auditshield-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: auditshield-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 2. Celery Worker (Escáneres asíncronos)
  - type: worker
    name: auditshield-worker
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: auditshield-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 3. Frontend Web Service (Next.js)
  - type: web
    name: auditshield-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: auditshield-backend
          property: url

databases:
  # Base de Datos PostgreSQL Administrada (Gratis)
  - name: auditshield-db
    databaseName: auditshield
    user: auditshield
