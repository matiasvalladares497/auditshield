services:
  # 1. Backend Web Service (FastAPI API REST en Docker) - Plan Gratis
  - type: web
    name: auditshield-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auditshield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 2. Frontend Web Service (Next.js Interface) - Plan Gratis
  - type: web
    name: auditshield-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: auditshield-backend
          property: host

databases:
  # Base de Datos PostgreSQL Administrada - Plan Gratis (Éxito)
  - name: auditshield-db
    databaseName: auditshield
    user: auditshield
    plan: free
