version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: auditshield_db
    environment:
      POSTGRES_USER: auditshield
      POSTGRES_PASSWORD: auditshield_secret
      POSTGRES_DB: auditshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auditshield_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditshield_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://auditshield:auditshield_secret@db:5432/auditshield
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-change-in-production-please
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./reports:/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditshield_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://auditshield:auditshield_secret@db:5432/auditshield
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-change-in-production-please
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - ./reports:/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditshield_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
